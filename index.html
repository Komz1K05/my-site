<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A6FB5">
<meta name="description" content="ЛапаПомощи: календарь ухода за питомцем с напоминаниями.">
<title>ЛапаПомощи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF5FC; --surface:#FFFFFF; --surface2:#F6FAFE; --ink:#15273A; --muted:#566B80; --dim:#8598AB; --line:#D7E5F2; --line2:#C3D7EA;
  --blue:#2A6FB5; --blue2:#225E9C; --blueInk:#FFFFFF; --soft:#DCEBFA; --softInk:#1E5A97;
  --vac:#DCEBFA; --vacD:#1E5A97; --par:#DDF3E7; --parD:#1F7350; --vet:#FCE4E6; --vetD:#A83A49; --gro:#EAE4FB; --groD:#5A44AE; --reg:#FFF1CF; --regD:#8A650C; --oth:#E9EEF3; --othD:#52667A;
  --danger:#C43D4B; --dangerSoft:#FCE4E6; --ok:#1F8A5B;
  --shadow:0 1px 2px rgba(21,39,58,.04),0 8px 24px rgba(42,111,181,.09); --shadowLg:0 24px 60px rgba(21,39,58,.2);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;font-weight:600;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i .f{fill:currentColor;stroke:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn{text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blueInk)}
.btn.primary:hover{background:var(--blue2);border-color:var(--blue2)}
.btn.soft{background:var(--soft);border-color:transparent;color:var(--softInk)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.lg{padding:14px 20px;font-size:16px;border-radius:16px}
.btn.icon{width:40px;height:40px;padding:0}
.btn.block{width:100%}
.btn.danger{color:var(--danger)} .btn.danger:hover{background:var(--dangerSoft);border-color:transparent}
.btn.gold{background:linear-gradient(135deg,#FFD978,#FFB84D);border-color:transparent;color:#4A3200}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:800;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:13px;padding:11px 13px;font-size:16px;font-weight:600;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--soft)}
.inp.err{border-color:var(--danger)}
.ferr{font-size:12.5px;color:var(--danger)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.g2.st{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--soft);color:var(--softInk);white-space:nowrap}
.chip.gray{background:var(--oth);color:var(--othD)} .chip.red{background:var(--dangerSoft);color:var(--danger)} .chip.gold{background:#FFF1CF;color:#8A650C}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* welcome */
.welcome{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(700px 420px at 100% 0,#CFE3F7 0,transparent 60%),radial-gradient(600px 420px at 0 100%,#DDF0FA 0,transparent 60%),var(--bg)}
.wcard{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadowLg);display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px}
.brand .lg{width:40px;height:40px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center}
.brand .lg svg{width:22px;height:22px}
.wcard h1{font-size:28px;line-height:1.12;text-wrap:balance}
.wcard p{margin:0;color:var(--muted)}
.wl{display:grid;gap:8px}
.wl div{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14.5px}
.wl .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}

/* shell */
.shell{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:26px;padding:24px 16px 40px;min-height:100vh;align-items:start}
.rail{position:sticky;top:24px;display:grid;gap:6px}
.rail .brand{padding:4px 8px 14px}
.rail a{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:14px;color:var(--muted);font-weight:800;text-decoration:none}
.rail a:hover{background:var(--surface)}
.rail a.on{background:var(--soft);color:var(--softInk)}
.rail .pro{margin-top:14px;border-radius:20px;padding:16px;background:linear-gradient(145deg,#2A6FB5,#5BA3E0);color:#fff;display:grid;gap:8px}
.rail .pro b{font-size:17px}
.rail .pro span{font-size:13px;opacity:.92;font-weight:600}
.main{min-width:0;max-width:720px;width:100%}
.bnav{display:none}
@media (max-width:880px){
  .shell{display:block;padding:14px 16px calc(98px + env(safe-area-inset-bottom,0px))}
  .rail{display:none} .main{max-width:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:7px 2px;border-radius:14px;text-decoration:none}
  .bnav a.on{color:var(--softInk);background:var(--soft)}
  .bnav svg{width:21px;height:21px}
}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.head .ey{font-size:13px;font-weight:900;color:var(--softInk);text-transform:uppercase;letter-spacing:.08em}
.head h1{font-size:clamp(25px,5vw,32px);line-height:1.12;margin-top:2px}
.head .acts{display:flex;gap:8px;align-items:center}
.bell{position:relative}
.bell .cnt{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;gap:10px}
.sec h2{font-size:18px;display:flex;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:14px;margin-bottom:14px}
.banner svg{color:var(--softInk);margin-top:2px}
.banner.warn{background:#FFF1CF} .banner.warn svg{color:#8A650C}

/* pets strip */
.pets{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.petchip{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line2);background:var(--surface);border-radius:18px;padding:8px 14px 8px 8px;cursor:pointer;flex:none;font-weight:800}
.petchip.on{border-color:var(--blue);background:var(--soft)}
.petchip small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ava{width:44px;height:44px;border-radius:50%;background:var(--soft) center/cover;color:var(--softInk);display:grid;place-items:center;flex:none;overflow:hidden}
.ava svg{width:24px;height:24px}
.ava.big{width:84px;height:84px} .ava.big svg{width:44px;height:44px}

/* tasks */
.grp{display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.task.over{border-color:#F0B8BF;background:#FFF7F8}
.task .ck{appearance:none;width:28px;height:28px;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface);transition:all .15s}
.task .ck:hover{border-color:var(--blue)}
.task .ck:checked{background:var(--ok);border-color:var(--ok)}
.task .ck:checked::after{content:"";width:11px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.task .bd{border:0;background:none;text-align:left;padding:0;cursor:pointer;min-width:0;display:grid;gap:3px}
.task .bd b{font-size:15.5px;font-weight:800;overflow-wrap:anywhere}
.task .bd span{font-size:13px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.task .when{text-align:right;font-size:13px;font-weight:800;white-space:nowrap}
.task .when small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.cat{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800}
.catic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:20px;padding:26px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:17px}
.empty .ava{width:60px;height:60px} .empty .ava svg{width:30px;height:30px}
.fab{position:fixed;right:max(20px,calc(50vw - 510px));bottom:28px;z-index:25;box-shadow:0 12px 30px rgba(42,111,181,.35)}
@media (max-width:880px){.fab{right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px))}}

/* calendar */
.wknav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.wknav b{font-size:18px;font-weight:900;text-align:center;flex:1}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg small{font-size:11px;font-weight:900;color:var(--dim);padding:4px 0}
.cd{aspect-ratio:1;max-height:54px;border:0;background:none;border-radius:14px;display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;font-weight:800;font-variant-numeric:tabular-nums;width:100%}
.cd:hover{background:var(--soft)}
.cd.on{background:var(--blue);color:#fff}
.cd.today:not(.on){outline:2px solid var(--blue);outline-offset:-2px}
.cd .dots{display:flex;gap:2px;height:6px}
.cd .dots i{width:6px;height:6px;border-radius:50%}

/* pets page */
.petcard{display:grid;gap:14px}
.petcard .top{display:flex;gap:14px;align-items:center}
.petcard h3{font-size:22px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.spec{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.spec span{display:block;font-size:12px;color:var(--muted);font-weight:800}
.spec b{font-weight:800}
.lockrow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#FFF6DD,#FFEFC2);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;color:#5C4300;flex-wrap:wrap}

/* history & stats */
.hist{display:grid}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow b{display:block;font-weight:800}
.hrow span{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{border-radius:18px;padding:14px;background:var(--soft);color:var(--softInk)}
.kpi b{display:block;font-size:26px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;font-weight:800;overflow-wrap:anywhere}
.kpi{min-width:0}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.hb .t{height:10px;border-radius:99px;background:var(--oth);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px;background:#5B9BD9}
.hb .v{font-weight:900;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.locked{position:relative;overflow:hidden}
.locked .bl{filter:blur(5px);opacity:.5;pointer-events:none}
.locked .lk{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.locked .lk>div{display:grid;gap:8px;justify-items:center;max-width:300px}

/* premium */
.offer{border-radius:26px;padding:24px;background:linear-gradient(150deg,#2A6FB5,#63A9E6);color:#fff;display:grid;gap:14px;margin-bottom:14px;box-shadow:var(--shadowLg)}
.offer h2{font-size:24px;line-height:1.15}
.offer p{margin:0;font-weight:600;opacity:.95}
.offer .pr{font-size:40px;font-weight:900;line-height:1}
.offer .pr small{font-size:16px;font-weight:700;opacity:.9}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:900;padding:8px;text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:11px 8px;border-top:1px solid var(--line);text-align:center;font-weight:700}
.cmp svg{color:var(--ok)} .cmp .no{color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0;padding-bottom:0} .row:first-child{padding-top:0}
.row b{display:block;font-weight:800} .row .d{font-size:13px;color:var(--muted)}

/* modal & toast */
.ov{position:fixed;inset:0;z-index:70;background:rgba(15,30,48,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{width:min(500px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border-radius:26px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadowLg);animation:pu .2s ease}
@keyframes pu{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:21px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.catbtn{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line2);background:var(--surface);border-radius:13px;padding:8px 10px;font-weight:800;font-size:13.5px;cursor:pointer;text-align:left}
.catbtn.on{border-color:var(--blue);background:var(--soft)}
.catbtn.lockd{opacity:.65}
.catbtn .catic{width:28px;height:28px;border-radius:9px}
.catbtn .catic svg{width:15px;height:15px}
.photo{display:flex;gap:14px;align-items:center}
@media (max-width:560px){.ov{place-items:end center;padding:0}.modal{border-radius:26px 26px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:11px 15px;font-size:14px;font-weight:800;display:flex;gap:10px;align-items:center;box-shadow:var(--shadowLg);animation:pu .2s}
.toast svg{color:#8FE0B8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layers"></div>

<script>
(function(){
"use strict";
/* ================================================================
   ЛапаПомощи — MVP в одном файле.
   format · store · auth · domain (питомцы, процедуры, напоминания,
   тарифы) · ui (модалки, списки, календарь) · экраны
   ================================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=s=>new Date(s+"T00:00:00");
const today=()=>iso(new Date());
const addDays=(s,n)=>{ const d=D(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths=(s,n)=>{ const d=D(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); return iso(d); };
const diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WDS=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
const WD=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const dl=s=>{ const d=D(s); return `${d.getDate()} ${MG[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""}`; };
const plural=(n,a,b,c)=>{ const m10=n%10,m100=n%100; return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c); };
const rel=s=>{ const n=diff(s,today()); return n===0?"сегодня":n===1?"завтра":n===-1?"вчера":n<0?`${-n} ${plural(-n,"день","дня","дней")} назад`:`через ${n} ${plural(n,"день","дня","дней")}`; };
function age(b){ if(!b) return ""; const a=D(b), n=new Date(); let m=(n.getFullYear()-a.getFullYear())*12+n.getMonth()-a.getMonth()-(n.getDate()<a.getDate()?1:0); if(m<0) m=0; const y=Math.floor(m/12); m%=12;
  return y?`${y} ${plural(y,"год","года","лет")}${m?` ${m} мес.`:""}`:`${m} мес.`; }

/* ---------- store & auth ---------- */
const mem={};
const store={ get(k,d){ try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} return k in mem?mem[k]:d; },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} } };
async function hash(pw,salt){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ let h=5381; for(const c of salt+":"+pw) h=((h<<5)+h+c.charCodeAt(0))|0; return "f"+(h>>>0).toString(16); } }
const Auth={ users:()=>store.get("lp:users",[]), me(){ const id=store.get("lp:session",null); return id?this.users().find(u=>u.id===id)||null:null; },
  async register({name,email,password}){ const o={}; name=name.trim(); email=email.trim().toLowerCase(); if(name.length<2) o.name="Минимум 2 символа"; if(!/^\S+@\S+\.\S+$/.test(email)) o.email="Проверьте email"; if(password.length<6) o.password="Минимум 6 символов";
    if(!o.email&&this.users().some(u=>u.email===email)) o.email="Такой email уже зарегистрирован"; if(Object.keys(o).length) return {errors:o}; const salt=uid(); const u={id:uid(),name,email,salt,hash:await hash(password,salt)}; store.set("lp:users",[...this.users(),u]); store.set("lp:session",u.id); return {user:u}; },
  async login({email,password}){ email=email.trim().toLowerCase(); const u=this.users().find(x=>x.email===email); if(!u||u.demo||u.hash!==await hash(password,u.salt)) return {errors:{password:"Неверный email или пароль"}}; store.set("lp:session",u.id); return {user:u}; },
  demo(){ let u=this.users().find(x=>x.demo); const fresh=!u; if(!u){ u={id:uid(),name:"Гость",email:"",demo:true}; store.set("lp:users",[...this.users(),u]); } store.set("lp:session",u.id); return {user:u,fresh}; },
  logout(){ store.del("lp:session"); } };

function nextDate(p){ return {day:addDays(p.date,1),week:addDays(p.date,7),month:addMonths(p.date,1),m3:addMonths(p.date,3),year:addMonths(p.date,12)}[p.repeat]||null; }

function toast(m){ const el=document.createElement("div"); el.className="toast"; el.innerHTML=ic("check")+esc(m); $("#toasts").appendChild(el); setTimeout(()=>{ el.style.opacity=0; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); },2800); }
function modal(html,{onClose}={}){ const ov=document.createElement("div"); ov.className="ov"; ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`; $("#layers").appendChild(ov);
  const close=()=>{ ov.remove(); document.removeEventListener("keydown",k); onClose&&onClose(); }; const k=e=>{ if(e.key==="Escape") close(); }; document.addEventListener("keydown",k);
  ov.addEventListener("mousedown",e=>{ if(e.target===ov) close(); }); $$("[data-close]",ov).forEach(b=>b.onclick=close); return {el:ov,close}; }
function confirmBox(t,x,ok="Удалить"){ return new Promise(res=>{ let done=false; const m=modal(`<h3>${esc(t)}</h3><div class="note" style="font-size:15px">${esc(x)}</div><div class="acts"><button class="btn" data-close>Отмена</button><button class="btn primary" id="cok">${esc(ok)}</button></div>`,{onClose:()=>{ if(!done) res(false); }}); $("#cok",m.el).onclick=()=>{ done=true; res(true); m.close(); }; }); }
function errs(form,o){ $$(".ferr",form).forEach(e=>e.textContent=""); $$(".inp",form).forEach(i=>i.classList.remove("err")); let first; Object.entries(o).forEach(([k,v])=>{ const i=form.querySelector(`[name="${k}"]`), e=form.querySelector(`[data-err="${k}"]`); if(e) e.textContent=v; if(i){ i.classList.add("err"); first=first||i; } }); first&&first.focus(); return !Object.keys(o).length; }

  const mp=$("#mprev"); if(mp){ mp.onclick=()=>mv(-1); $("#mnext").onclick=()=>mv(1); }
  $$("[data-hcat]").forEach(b=>b.onclick=()=>{ UI.hcat=b.dataset.hcat; render(); });
  const bp=$("#buyPro"); if(bp) bp.onclick=()=>{ S.plan="pro"; S.proSince=today(); save(); toast("Premium включён (тестовый режим)"); render(); };
  const cp=$("#cancelPro"); if(cp) cp.onclick=async()=>{ if(await confirmBox("Отключить Premium?","Питомцы и процедуры сохранятся, но добавить второго питомца и больше 7 напоминаний будет нельзя.","Отключить")){ S.plan="free"; save(); toast("Premium отключён"); render(); } };
  const sd=$("#seed"); if(sd) sd.onclick=async()=>{ if(!S.pets.length||await confirmBox("Загрузить пример?","Текущие питомцы и процедуры заменятся примером с Барсиком.","Загрузить")){ seedDemo(); toast("Пример загружен"); location.hash="home"; render(); } };
  const wp=$("#wipe"); if(wp) wp.onclick=async()=>{ if(await confirmBox("Удалить все данные?","Питомцы, процедуры и история удалятся без возможности восстановления.")){ S.pets=[]; S.procs=[]; S.activePet="all"; save(); toast("Данные удалены"); render(); } };
  const lo=$("#logout"); if(lo) lo.onclick=()=>{ Auth.logout(); ME=null; S=null; UI.auth="start"; location.hash=""; render(); }; }

/* ---------- welcome ---------- */
function Welcome(){ const a=UI.auth;
  if(a==="login"||a==="register") return `<div class="welcome"><form class="wcard" id="af" novalidate><div class="brand"><span class="lg">${ic("paw")}</span>ЛапаПомощи</div>
    <div><h1>${a==="login"?"Вход":"Регистрация"}</h1><p style="margin-top:6px">${a==="login"?"Введите email и пароль.":"Аккаунт хранится в этом браузере."}</p></div>
    ${a==="register"?`<label class="field"><span>Имя</span><input class="inp" name="name" autocomplete="given-name" placeholder="Марта"><div class="ferr" data-err="name"></div></label>`:""}
    <label class="field"><span>Email</span><input class="inp" name="email" type="email" autocomplete="email" placeholder="you@mail.ru"><div class="ferr" data-err="email"></div></label>
    <label class="field"><span>Пароль</span><input class="inp" name="password" type="password" autocomplete="${a==="login"?"current-password":"new-password"}"><div class="ferr" data-err="password"></div></label>
    <button class="btn primary lg block">${a==="login"?"Войти":"Создать аккаунт"}</button><button type="button" class="btn ghost block" id="aback">Назад</button></form></div>`;
  return `<div class="welcome"><div class="wcard"><div class="brand"><span class="lg">${ic("paw")}</span>ЛапаПомощи</div>
    <div><h1>Помнит за вас то, что важно для вашего питомца</h1><p style="margin-top:8px">Прививки, обработки, ветеринар и груминг в одном календаре с напоминаниями.</p></div>
    <div class="wl">${[["vac","syringe","Вакцинации и обработки по графику"],["vet","steth","Визиты к ветеринару и груминг"],["reg","bell","Напоминания заранее"],["par","hist","История ухода в одном месте"]].map(([c,i,t])=>`<div><span class="ic" style="background:var(--${c});color:var(--${c}D)">${ic(i)}</span>${t}</div>`).join("")}</div>
    <button class="btn primary lg block" id="wDemo">Посмотреть на примере</button>
    <div class="g2"><button class="btn" id="wReg">Регистрация</button><button class="btn" id="wLog">Войти</button></div></div></div>`; }
function bindWelcome(){ const a=UI.auth;
  if(a==="start"){ $("#wDemo").onclick=()=>{ const r=Auth.demo(); ME=r.user; load(); if(r.fresh||!S.pets.length) seedDemo(); location.hash="home"; render(); toast("Открыт пример: Барсик и его календарь"); }; $("#wReg").onclick=()=>{ UI.auth="register"; render(); }; $("#wLog").onclick=()=>{ UI.auth="login"; render(); }; return; }
  $("#aback").onclick=()=>{ UI.auth="start"; render(); }; $("#af").onsubmit=async e=>{ e.preventDefault(); const r=await Auth[a](fdata(e.target)); if(r.errors){ errs(e.target,r.errors); return; } ME=r.user; load(); UI.auth="start"; location.hash="home"; render(); toast(a==="login"?"С возвращением, "+ME.name:"Аккаунт создан"); }; setTimeout(()=>{ const f=$("#af input"); f&&f.focus(); },40); }

/* ---------- router ---------- */
window.addEventListener("hashchange",()=>render());
function render(){ $("#layers").innerHTML=""; ME=ME||Auth.me(); if(ME&&!S) load(); const app=$("#app");
  if(!ME){ app.innerHTML=Welcome(); bindWelcome(); return; }
  let r=(location.hash||"#home").slice(1); if(!Screens[r]) r="home"; route=r; if(S.activePet!=="all"&&!pet(S.activePet)) S.activePet="all";
  app.innerHTML=shell(Screens[r](),["home","calendar"].includes(r)&&S.pets.length>0); bindApp(); }
render();
})();
</script>

</body>
